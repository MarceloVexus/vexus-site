  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Roboto+Slab:wght@200;300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">

<body>

  <!-- Cabeçalho (definido uma vez em src/layout.html) -->

      <a class="logo" href="/"><img src="assets/img/logo.png" alt="Vexus Capital | Safra Invest"></a>

  <!-- Conteúdo da página -->

  <!-- Rodapé: só a marca (pedido dele em 26/08/2026, *"pode tirar o rodapé e deixar só a
       logo"*). O contato vive na seção de contato da home, que é onde ele é usado. -->
  <footer class="rodape rodape-limpo">
    <div class="wrap">
      <img class="rodape-logo" src="assets/img/logo.png" alt="Vexus Capital | Safra Invest">
    </div>
  </footer>

  <script>
  /* Revelação ao entrar na tela. Três cintos, na mesma ordem do mock aprovado:
     quem já está visível aparece de imediato, o observador cuida do resto, e um
     temporizador garante que nada fique invisível se o observador falhar. */
  (function () {
    var alvos = function () {
      return Array.prototype.slice.call(
        document.querySelectorAll('[data-in]:not(.vis),[data-rule]:not(.vis)'));
    };
    var revelar = function (el) {
      if (el.classList.contains('vis')) return;
      var irmaos = Array.prototype.filter.call(
        el.parentElement ? el.parentElement.children : [],
        function (n) { return n.hasAttribute('data-in'); });
      el.style.animationDelay = (Math.max(0, irmaos.indexOf(el)) * 90) + 'ms';
      el.classList.add('vis');
    };
    var varrer = function () {
      alvos().forEach(function (el) {
        if (el.getBoundingClientRect().top < window.innerHeight * 0.92) revelar(el);
      });
    };
    varrer();
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (ents) {
        ents.forEach(function (e) {
          if (e.isIntersecting) { revelar(e.target); io.unobserve(e.target); }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      alvos().forEach(function (el) { io.observe(el); });
    }
    document.addEventListener('scroll', varrer, true);
    window.addEventListener('resize', varrer);
    setTimeout(varrer, 600);
    setTimeout(function () { alvos().forEach(revelar); }, 4000);
  }());

  /* O menu de celular: o mesmo <nav>, aberto por classe. */
  (function () {
    var b = document.querySelector('.menu-btn'), n = document.querySelector('.nav');
    if (b && n) b.addEventListener('click', function () { n.classList.toggle('aberto'); });
  }());
  </script>

</body>
</html>
